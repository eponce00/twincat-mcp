name: MCP contract and security regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python-tests:
    name: Python ${{ matrix.python }} contract checks
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade -r mcp-server/requirements-bootstrap.txt
      - run: python -m pip install -r mcp-server/requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check mcp-server
      - run: python -m unittest discover -s mcp-server/tests -v
