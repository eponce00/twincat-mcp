name: MCP contract and security regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python-tests:
    name: Python ${{ matrix.python }} contract checks
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade -r mcp-server/requirements-bootstrap.txt
      - run: python -m pip install -r mcp-server/requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check mcp-server
      - run: python -m unittest discover -s mcp-server/tests -v
